<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login or Register — StyleHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
  <div class="container">
    <a href="index.html" class="logo">Style<span>Hub</span></a>
    <nav class="nav-links"><a href="index.html">← Back to Home</a></nav>
  </div>
</header>

<section class="container">
  <div class="auth-wrap">
    <div class="auth-tabs">
      <button class="active" data-tab="login">Login</button>
      <button data-tab="register">Register</button>
    </div>

    <div class="auth-panel active" id="panel-login">
      <form id="login-form">
        <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
        <div class="form-group"><label>Password</label><input type="password" name="password" required minlength="4"></div>
        <button class="btn btn-primary btn-block" type="submit">Login</button>
      </form>
      <p style="text-align:center; font-size:.82rem; color:var(--gray); margin-top:16px;">Demo mode — any email & password (4+ chars) works.</p>
    </div>

    <div class="auth-panel" id="panel-register">
      <form id="register-form">
        <div class="form-group"><label>Full Name</label><input type="text" name="name" required></div>
        <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
        <div class="form-group"><label>Password</label><input type="password" name="password" required minlength="4"></div>
        <button class="btn btn-primary btn-block" type="submit">Create Account</button>
      </form>
    </div>
  </div>
</section>

<footer class="footer"><div class="container"><div class="footer-bottom">© 2026 StyleHub. All rights reserved. Built as a web development internship project.</div></div></footer>

<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script>
  document.querySelectorAll(".auth-tabs button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".auth-tabs button").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".auth-panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
    });
  });

  function goNext(){
    const next = qs("next");
    window.location.href = next && next !== "login.html" ? next : "account.html";
  }

  document.getElementById("login-form").addEventListener("submit", e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    Store.login(fd.get("email"));
    showToast("Welcome back!");
    setTimeout(goNext, 500);
  });

  document.getElementById("register-form").addEventListener("submit", e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    Store.login(fd.get("email"), fd.get("name"));
    showToast("Account created — welcome to StyleHub!");
    setTimeout(goNext, 500);
  });
</script>
</body>
</html>
